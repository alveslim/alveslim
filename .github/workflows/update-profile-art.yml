name: Update profile art

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/generate_profile_svgs.py"
      - ".github/workflows/update-profile-art.yml"

permissions:
  contents: write

jobs:
  update-art:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies & Generate SVGs
        env:
          GITHUB_USER: alveslim
        run: |
          pip install requests beautifulsoup4
          python scripts/generate_profile_svgs.py

      - name: Commit and push updated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contrib-heatmap.svg stats.svg
          git diff --staged --quiet || git commit -m "chore: refresh contribution and streak stats [skip ci]"
          git push
